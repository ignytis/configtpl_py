{% set base_url = "example.com" %}
{
  "urls": {
    "base": "{{ base_url }}",
    "subdomain": "{{ env('SAMPLE_ENV_KEY') }}.{{ base_url }}"
  },
  "server": {
    "host": "{{ base_url }}",
    "port": 1234
  },
  "greetings": [
    {% for greeting in cmd('echo "First\nSecond\nThird"') | split_space %}
    "Hello, {{ greeting }}!"{{ "," if not loop.last }}
    {% endfor %}
  ],
  "file_contents":
    {{ file("additional_cfg.cfg") | indent(4) }},
  "globals": {
    "md5": "{{ "Hello, World" | md5 }}",
    "sha512": "{{ "Hello, World" | sha256 }}",
    "base64": "{{ "Hello, World" | base64 }}",
    "base64_decode": "{{ "Lorem Ipsum" | base64 | base64_decode }}"
  }
}
